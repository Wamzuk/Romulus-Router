<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romulus Router</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(255,255,255,.82);
    --text: #5b5675;
    --title: #3b2a6b;
    --strong: #2d2150;
    --muted: #8a84a3;
    --line: rgba(124,58,237,.14);
    --accent: #7c3aed;
    --accent-soft: rgba(124,58,237,.09);
    --grad: linear-gradient(180deg, #9b5de5 0%, #6d35d6 100%);
    --field: rgba(255,255,255,.95);
    --field-line: #ddd6fe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #e8ecef; color: var(--text); font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.5; overflow: hidden; }

  #map { position: fixed; inset: 0; background: #aab4e0; }

  .toppill { position: absolute; z-index: 1000; top: 16px; left: calc(50% + 208px); transform: translateX(-50%); padding: 10px 34px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(76,29,149,.15); text-align: center; pointer-events: none; }
  .toppill h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--title); }
  .toppill small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }

  aside { position: absolute; z-index: 1000; top: 16px; left: 16px; width: 400px; max-width: calc(100% - 32px); max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.7); border-radius: 24px; box-shadow: 0 10px 40px rgba(76,29,149,.18); }
  .head { padding: 20px 20px 0; }
  .intro { margin: 0; font-size: 15px; line-height: 1.55; color: var(--text); }

  .drop { display: block; margin: 16px 20px 0; padding: 22px 12px; border: 2px dashed #c4b5fd; border-radius: 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; color: var(--accent); font-size: 17px; font-weight: 800; }
  .drop span { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }

  .status { margin: 14px 20px 0; padding-bottom: 16px; font-size: 15px; font-weight: 600; color: var(--text); }
  .status.error { color: #dc2626; }

  .panel { border-top: 1px solid var(--line); padding: 18px 20px 20px; flex: 1; }
  .panel > p { margin: 0; font-size: 15px; line-height: 1.55; }

  .route-wrap { padding-bottom: 0; margin-bottom: 0; }
  .prompt { margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--strong); font-size: 15px; font-weight: 600; line-height: 1.4; }
  .prompt.done { background: rgba(34,197,94,.12); }
  .pt { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .pt .info { flex: 1; min-width: 0; }
  .pt .lbl { font-size: 14px; color: var(--muted); }
  .pt .val { font-size: 16px; color: var(--strong); overflow-wrap: anywhere; }
  .pt.active .lbl { color: var(--accent); }
  .badge { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .badge.s { background: #f97316; }
  .badge.e { background: #1f2937; }

  .btn { font: inherit; font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: 14px; border: 1px solid var(--field-line); background: #fff; color: var(--accent); cursor: pointer; transition: transform .1s, box-shadow .15s; }
  .btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 6px 0; margin-top: 2px; }
  .btn.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(109,53,214,.35); }
  .btn.primary:hover:not(:disabled), .btn.primary:focus-visible:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(109,53,214,.45); }

  .pin { font-size: 30px; line-height: 1; width: 34px; height: 34px; display: grid; place-items: center; filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }

  .pt-input { width: 100%; padding: 10px 14px; background: var(--field); border: 1px solid var(--field-line); border-radius: 14px; color: var(--strong); font: inherit; font-size: 16px; }
  .pt-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pt-input.set { border-color: #86d3a5; }

  .field { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0 10px; }
  .field .info { flex: 1; min-width: 0; position: relative; }
  .field .lbl { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .field:focus-within .lbl { color: var(--accent); }
  .field .badge { margin-top: 26px; }
  .suggest { position: absolute; left: 0; right: 0; top: 100%; z-index: 1200; margin: 4px 0 0; padding: 6px; list-style: none; background: #fff; border: 1px solid var(--field-line); border-radius: 14px; box-shadow: 0 10px 28px rgba(76,29,149,.2); max-height: 260px; overflow-y: auto; }
  .suggest[hidden] { display: none; }
  .suggest li { padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 15px; color: var(--strong); }
  .suggest li small { display: block; font-size: 12px; color: var(--muted); }
  .suggest li.on, .suggest li:hover { background: var(--accent-soft); }
  .suggest li.empty { cursor: default; color: var(--muted); }
  .suggest li.empty:hover { background: none; }

  .method { margin: 4px 0 16px; }
  .method .lbl { display: block; margin-bottom: 8px; text-align: center;}
  .seg { display: flex; padding: 4px; gap: 4px; background: var(--accent-soft); border-radius: 14px; }
  .seg button { flex: 1; padding: 8px 6px; font: inherit; font-size: 14px; font-weight: 700; background: none; color: var(--accent); border: 0; border-radius: 11px; cursor: pointer; }
  .seg button.on { background: var(--grad); color: #fff; box-shadow: 0 3px 10px rgba(109,53,214,.35); }
  .seg button:hover:not(.on) { background: rgba(124,58,237,.12); }
  .actions { display: flex; gap: 10px; margin: 4px 0 2px; }
  .actions .btn { flex: 1; }

  .results-panel { margin-top: 20px; }
  .results-panel h2 { margin: 0 0 10px; font-size: 18px; font-weight: 800; color: var(--title); }
  .route-note { margin: 0 0 12px; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .route-note.warn { color: #c2410c; }
  .route-note.same { color: #15803d; }

  .route-item { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin: 0 0 8px; background: rgba(255,255,255,.9); border: 1px solid var(--line); border-left-width: 5px; border-radius: 14px; color: var(--text); font: inherit; cursor: pointer; }
  .route-item:hover, .route-item:focus-visible { border-color: var(--accent); outline: none; }
  .route-item.sel { background: #f5f0ff; }
  .route-item .swatch { flex: 0 0 auto; width: 14px; height: 14px; border-radius: 4px; margin-top: 4px; }
  .route-item .rtitle { font-size: 16px; color: var(--strong); font-weight: 700; }
  .route-item .rmeta { font-size: 14px; color: var(--muted); }
  .route-item .rtag { display: inline-block; font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }

  .timing { margin: 6px 0 16px; }
  .timing table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .timing th, .timing td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .timing th { color: var(--muted); font-weight: 600; }
  .timing td { color: var(--strong); font-variant-numeric: tabular-nums; }
  .timing caption { text-align: left; font-size: 14px; color: var(--muted); padding: 0 0 6px; }
  .speedup { font-size: 15px; color: var(--strong); margin: 2px 0 14px; }
  .speedup b { color: var(--accent); }

  .bench { margin-top: 10px; }
  .bench pre { margin: 10px 0 0; padding: 10px 12px; background: var(--field); border: 1px solid var(--field-line); border-radius: 14px; color: var(--strong); font-size: 13px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; }
  .spin { display: inline-block; }


  /* Leaflet controls, DriveGuess style */
  .leaflet-container { font-family: inherit; }
  .leaflet-top.leaflet-right .leaflet-control { margin: 16px 16px 0 0; }
  .leaflet-bar { border: 0 !important; border-radius: 999px !important; overflow: hidden; background: var(--glass); backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(76,29,149,.18) !important; }
  .leaflet-bar a { width: 46px; height: 46px; line-height: 44px; font-size: 28px; font-weight: 400; color: var(--accent); background: transparent; border-bottom: 1px solid var(--line); border-radius: 0 !important; }
  .leaflet-bar a:last-child { border-bottom: 0; }
  .leaflet-bar a:hover { background: var(--accent-soft); color: var(--accent); }
  .leaflet-control-attribution { margin: 0 12px 12px 0 !important; padding: 4px 12px !important; border-radius: 999px; background: var(--glass) !important; backdrop-filter: blur(10px); font-size: 12px; color: var(--text); }
  .leaflet-control-attribution a { color: var(--text); }
  .leaflet-popup-content-wrapper { border-radius: 16px; }
  .leaflet-popup-content { font-size: 14px; line-height: 1.45; margin: 12px 14px; max-height: 260px; overflow: auto; }
  .leaflet-popup-content table { border-collapse: collapse; }
  .leaflet-popup-content th { text-align: left; padding: 2px 10px 2px 0; color: #444; font-weight: 700; vertical-align: top; }
  .leaflet-popup-content td { padding: 2px 0; word-break: break-word; }

  @media (max-width: 720px) {
    aside { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-width: none; max-height: 52vh; border-radius: 24px 24px 0 0; }
    .toppill { left: 50%; padding: 8px 24px; }
    .toppill h1 { font-size: 18px; }
    .leaflet-control-attribution { margin-bottom: calc(52vh + 8px) !important; }
  }
</style>
</head>
<body>
  <div class="toppill"><h1>Romulus Router</h1><small>Route finder</small></div>

  <aside id="sidebar">
    <div class="head">
      
    </div>

    <label class="drop" id="drop">
      <strong>Load road network (GeoJSON)</strong>
      <span>or drag it here (.geojson or .json)</span>
      <input type="file" id="file" accept=".geojson,.json,application/geo+json,application/json">
    </label>

    <div class="status" id="status" role="status">Load a GeoJSON file to search within it.</div>

    <div class="panel">
      <div class="route-wrap" id="route">
        <p class="prompt" id="prompt"></p>
        <div class="field" id="startField">
          <span class="badge s">A</span>
          <div class="info">
            <label class="lbl" for="startInput">Start point</label>
            <input type="search" id="startInput" class="pt-input" placeholder="Search a feature or lat, lng" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="startList">
            <ul class="suggest" id="startList" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="field" id="endField">
          <span class="badge e">B</span>
          <div class="info">
            <label class="lbl" for="endInput">End point</label>
            <input type="search" id="endInput" class="pt-input" placeholder="Search a feature or lat, lng" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="endList">
            <ul class="suggest" id="endList" role="listbox" hidden></ul>
          </div>
        </div>
        <button type="button" class="btn link" id="clearPts">Clear both points</button>

        <!-- Snapping method control (added) -->
        <div class="method">
          <span class="lbl">Data Structure</span>
          <div class="seg" id="methodSeg" role="group" aria-label="Snapping method">
            <button type="button" data-method="kdtree" class="on">K-d tree</button>
            <button type="button" data-method="brute">Alternative</button>
            <button type="button" data-method="both">Compare</button>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn primary" id="findBtn" disabled>Find route</button>
          <button type="button" class="btn" id="benchBtn" disabled>Run benchmark</button>
        </div>

        <!-- Results (added) -->
        <div class="results-panel" id="routeResults" hidden></div>
        <div class="bench" id="benchResults" hidden></div>
      </div>
    </div>
  </aside>

  <div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script>
(function () {
  var mapEl = document.getElementById('map');
  var map = L.map('map', { zoomSnap: 0, zoomDelta: 1, worldCopyJump: true, minZoom: 1, attributionControl: true });
  var worldZoom = Math.log2(mapEl.clientWidth / 256);
  map.setView([22, 8], Math.max(worldZoom, 1.5));

  // OpenFreeMap vector tiles (same provider as DriveGuess). Styles: liberty, bright, positron, dark, fiord
  var streetLayer = L.maplibreGL({
    style: 'https://tiles.openfreemap.org/styles/liberty',
    attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  });
  streetLayer.addTo(map);
  map.zoomControl.setPosition('topright');
  map.attributionControl.setPrefix(false);

  var layer = null;
  var dataBounds = null;
  var features = [];   // { feature, leaflet, text }
  var els = {
    drop: document.getElementById('drop'),
    file: document.getElementById('file'),
    status: document.getElementById('status'),
    sidebar: document.getElementById('sidebar')
  };

  var style = { color: '#7c3aed', weight: 3, opacity: 1, fillColor: '#7c3aed', fillOpacity: 0.2 };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function popupHtml(props) {
    var keys = props ? Object.keys(props) : [];
    if (!keys.length) return '<em>No properties</em>';
    return '<table>' + keys.map(function (k) {
      var v = props[k];
      if (v !== null && typeof v === 'object') v = JSON.stringify(v);
      return '<tr><th>' + esc(k) + '</th><td>' + esc(v) + '</td></tr>';
    }).join('') + '</table>';
  }

  function featureName(f, i) {
    var p = f.properties || {};
    var keys = ['name', 'Name', 'NAME', 'title', 'label', 'id', 'ID'];
    for (var j = 0; j < keys.length; j++) if (p[keys[j]] != null && p[keys[j]] !== '') return String(p[keys[j]]);
    if (f.id != null) return String(f.id);
    return 'Feature ' + (i + 1);
  }

  function kindOf(f) {
    var t = f.geometry && f.geometry.type;
    if (!t) return 'No geometry';
    if (/Point/.test(t)) return 'Point';
    if (/LineString/.test(t)) return 'Line';
    if (/Polygon/.test(t)) return 'Polygon';
    return t;
  }

  function normalize(data) {
    if (data.type === 'FeatureCollection') return data;
    if (data.type === 'Feature') return { type: 'FeatureCollection', features: [data] };
    if (data.type === 'GeometryCollection' || data.coordinates) {
      return { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: data }] };
    }
    throw new Error('This file is not valid GeoJSON.');
  }

  function setStatus(msg, isError) {
    els.status.textContent = msg;
    els.status.classList.toggle('error', !!isError);
  }

  // Keep the raw text around so we can POST it to the C++ server unchanged.
  var lastFileText = null;

  // ---- Outline of the loaded network ----
  // Draws a glowing border around the outer edge of the data (its convex hull)
  // and gently dims the map outside it. Set DIM_OUTSIDE to false for border only.
  var DIM_OUTSIDE = true;
  var outlineLayer = null;

  function collectCoords(g, out) {
    if (!g) return out;
    if (g.type === 'GeometryCollection') { (g.geometries || []).forEach(function (x) { collectCoords(x, out); }); return out; }
    (function walk(a) {
      if (typeof a[0] === 'number') out.push([a[0], a[1]]);   // [lng, lat]
      else a.forEach(walk);
    })(g.coordinates || []);
    return out;
  }

  // Andrew's monotone chain convex hull. Input/output are [lng, lat] pairs.
  function convexHull(pts) {
    pts = pts.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    var n = pts.length;
    if (n < 3) return pts;
    function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
    var lower = [], upper = [], i;
    for (i = 0; i < n; i++) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], pts[i]) <= 0) lower.pop();
      lower.push(pts[i]);
    }
    for (i = n - 1; i >= 0; i--) {
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], pts[i]) <= 0) upper.pop();
      upper.push(pts[i]);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  function clearOutline() {
    if (outlineLayer) { map.removeLayer(outlineLayer); outlineLayer = null; }
  }

  // Exterior rings (as [lat, lng] lists) of any Polygon / MultiPolygon in the file,
  // merged so overlapping polygons become one shape. Holes are ignored on purpose:
  // we only want the outside edge.
  function polygonRings(fc) {
    var polys = [];
    fc.features.forEach(function (f) {
      (function walk(g) {
        if (!g) return;
        if (g.type === 'Polygon') polys.push(g.coordinates);
        else if (g.type === 'MultiPolygon') g.coordinates.forEach(function (c) { polys.push(c); });
        else if (g.type === 'GeometryCollection') (g.geometries || []).forEach(walk);
      })(f && f.geometry);
    });
    if (!polys.length) return null;

    var outers = polys.map(function (c) { return [c[0]]; });   // exterior ring only
    var exteriors = null;
    // Merging is only worth it for a modest number of polygons.
    if (outers.length > 1 && outers.length <= 200 && window.turf) {
      try {
        var merged = turf.polygon(outers[0]);
        for (var i = 1; i < outers.length; i++) merged = turf.union(merged, turf.polygon(outers[i])) || merged;
        var g = merged.geometry;
        exteriors = (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).map(function (c) { return c[0]; });
      } catch (e) { exteriors = null; }
    }
    if (!exteriors) exteriors = outers.map(function (c) { return c[0]; });
    return exteriors.map(function (r) { return r.map(function (c) { return [c[1], c[0]]; }); });
  }

  function drawOutline(fc, bounds) {
    clearOutline();
    var rings = polygonRings(fc);

    if (!rings) {
      // No polygons in the file (e.g. just roads): use the convex hull of every point.
      var coords = [];
      fc.features.forEach(function (f) { collectCoords(f && f.geometry, coords); });
      if (!coords.length) return;
      var hull = convexHull(coords);
      if (hull.length >= 3) {
        rings = [hull.map(function (c) { return [c[1], c[0]]; })];
      } else {
        var bb = bounds.pad(0.05);
        if (bb.getNorth() === bb.getSouth() || bb.getEast() === bb.getWest()) bb = L.latLngBounds(
          [bb.getSouth() - 0.0005, bb.getWest() - 0.0005], [bb.getNorth() + 0.0005, bb.getEast() + 0.0005]);
        rings = [[bb.getSouthWest(), bb.getNorthWest(), bb.getNorthEast(), bb.getSouthEast()]];
      }
    }

    outlineLayer = L.layerGroup();

    if (DIM_OUTSIDE) {
      var world = [[-85, -720], [-85, 720], [85, 720], [85, -720]];
      // World rectangle with a hole cut out for each outline.
      L.polygon([world].concat(rings), {
        stroke: false, fillColor: '#2d2150', fillOpacity: 0.28, interactive: false
      }).addTo(outlineLayer);
    }

    // Soft glow under a crisp line.
    L.polygon(rings, { color: '#7c3aed', weight: 12, opacity: 0.18, fill: false, interactive: false, lineJoin: 'round' }).addTo(outlineLayer);
    L.polygon(rings, { color: '#7c3aed', weight: 3.5, opacity: 1, fill: false, interactive: false, lineJoin: 'round' }).addTo(outlineLayer);

    outlineLayer.addTo(map);
  }

  function load(data, fileName, rawText) {
    var fc = normalize(data);
    if (layer) { map.removeLayer(layer); layer = null; }
    clearOutline();
    features = [];
    dataBounds = null;

    // We BUILD the GeoJSON layer so that search, popups and start/end point
    // picking keep working, but we deliberately DO NOT add it to the map. That
    // keeps the map clean (just the base map) instead of highlighting
    // every road and building. The route you find is what gets drawn.
    var idx = 0;
    layer = L.geoJSON(fc, {
      style: function () { return style; },
      pointToLayer: function (f, latlng) {
        return L.circleMarker(latlng, { radius: 7, color: '#fff', weight: 2, fillColor: '#7c3aed', fillOpacity: 1 });
      },
      onEachFeature: function (f, lyr) {
        var i = idx++;
        lyr.bindPopup(popupHtml(f.properties));
        var props = f.properties || {};
        var text = Object.keys(props).map(function (k) { return k + ' ' + props[k]; }).join(' ').toLowerCase();
        features.push({ feature: f, leaflet: lyr, name: featureName(f, i), kind: kindOf(f), text: (featureName(f, i) + ' ' + text).toLowerCase() });
      }
    });   // note: NOT .addTo(map) — the network is not drawn on load

    var n = features.length;
    if (!n) { setStatus(fileName + ' has no features.', true); els.sidebar.classList.remove('loaded'); return; }

    // Fit the view to where the data is, even though we are not drawing it.
    var b = layer.getBounds();
    if (b.isValid()) {
      dataBounds = b;
      map.fitBounds(b, { padding: [40, 40], maxZoom: 16 });
      drawOutline(fc, b);
    }

    setStatus(fileName + ' \u2014 ' + n + (n === 1 ? ' feature' : ' features') + ' loaded.');
    els.sidebar.classList.add('loaded');
    resetPoints();

    // Reloading a new file replaces the old graph: clear routes + graph state.
    lastFileText = rawText;
    clearRoutes();
    graphReady = false;
    graphStats = null;
    hideRouteResults();
    hideBenchResults();
    updateFindEnabled();
    ui.start.input.focus();

    // Build the routing graph on the C++ server from the same text.
    buildGraph(rawText, fileName);
  }

  // ---- Start / end point search ----
  var $ = function (id) { return document.getElementById(id); };
  var pts = { start: null, end: null };
  var pins = { start: null, end: null };
  var ui = {
    start: { input: $('startInput'), list: $('startList'), items: [], on: -1 },
    end:   { input: $('endInput'),   list: $('endList'),   items: [], on: -1 }
  };

  function fmt(ll) { return ll.lat.toFixed(5) + ', ' + ll.lng.toFixed(5); }

  function flat(a, out) {
    a.forEach(function (v) { if (Array.isArray(v)) flat(v, out); else out.push(v); });
    return out;
  }

  // Where a feature sits: a point's own position, the vertex of a line nearest its middle,
  // or the centre of a polygon.
  function locationOf(x) {
    var l = x.leaflet;
    if (l.getLatLng) return l.getLatLng();
    var c = l.getBounds().getCenter();
    if (x.kind === 'Line' && l.getLatLngs) {
      var best = null, d = Infinity;
      flat(l.getLatLngs(), []).forEach(function (v) {
        var dd = map.distance(v, c);
        if (dd < d) { d = dd; best = v; }
      });
      if (best) return best;
    }
    return c;
  }

  function parseCoords(q) {
    var m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (!m) return null;
    var lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    var point = L.latLng(lat, lng);
    return dataBounds && dataBounds.contains(point) ? point : null;
  }

  function renderPrompt() {
    var p = $('prompt');
    p.classList.toggle('done', !!(pts.start && pts.end));
    if (pts.start && pts.end) p.textContent = 'Start and end points are set.';
    else if (pts.start) p.textContent = 'Start point set. Now search for your end point.';
    else if (pts.end) p.textContent = 'End point set. Now search for your start point.';
    else p.textContent = 'Search for a start point and an end point.';
    if (!graphReady) p.textContent += ' Load a road network to enable routing.';
    ['start', 'end'].forEach(function (k) { ui[k].input.classList.toggle('set', !!pts[k]); });
  }

  function placePin(k, ll) {
    if (pins[k]) map.removeLayer(pins[k]);
    pins[k] = L.marker(ll, {
      icon: L.divIcon({ className: '', html: '<div class="pin ' + (k === 'start' ? 's">\uD83D\uDEB6' : 'e">\uD83C\uDFC1') + '</div>', iconSize: [34, 34], iconAnchor: [17, 17] }),
      keyboard: false, zIndexOffset: 1000
    }).addTo(map);
  }

  function unsetPoint(k) {
    pts[k] = null;
    if (pins[k]) { map.removeLayer(pins[k]); pins[k] = null; }
  }

  function closeList(k) {
    var u = ui[k];
    u.list.hidden = true; u.items = []; u.on = -1;
    u.input.setAttribute('aria-expanded', 'false');
  }

  function choose(k, ll, label) {
    pts[k] = ll;
    ui[k].input.value = label;
    placePin(k, ll);
    closeList(k);
    renderPrompt();
    updateFindEnabled();
    if (pts.start && pts.end) {
      map.fitBounds(L.latLngBounds([pts.start, pts.end]), { padding: [90, 90], maxZoom: 16 });
    } else {
      map.setView(ll, Math.max(map.getZoom(), 12));
      var other = k === 'start' ? 'end' : 'start';
      if (!pts[other]) ui[other].input.focus();
    }
  }

  function highlight(k) {
    var u = ui[k];
    Array.prototype.forEach.call(u.list.children, function (li, i) { li.classList.toggle('on', i === u.on); });
    var el = u.list.children[u.on];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  function renderList(k) {
    var u = ui[k];
    u.list.innerHTML = '';
    if (!u.items.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = u.msg || 'No matches.';
      u.list.appendChild(li);
    }
    u.items.forEach(function (it, i) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.innerHTML = esc(it.label) + '<small>' + esc(it.sub) + '</small>';
      li.addEventListener('mousedown', function (e) { e.preventDefault(); pickItem(k, i); });
      u.list.appendChild(li);
    });
    if (u.on >= u.items.length) u.on = u.items.length ? 0 : -1;
    u.list.hidden = false;
    u.input.setAttribute('aria-expanded', 'true');
    highlight(k);
  }

  function showSuggestions(k) {
    var u = ui[k];
    var raw = u.input.value;
    var q = raw.trim().toLowerCase();
    u.items = []; u.msg = '';
    if (!q) { closeList(k); return; }
    if (!layer || !dataBounds) {
      u.msg = 'Load a GeoJSON file before searching.';
      u.on = -1;
      renderList(k);
      return;
    }

    var coord = parseCoords(raw);
    if (coord) u.items.push({ label: fmt(coord), sub: 'Use these coordinates', ll: coord });

    var hits = features.filter(function (x) { return x.text.indexOf(q) !== -1; });
    hits.sort(function (a, b) {
      var as = a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      var bs = b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      return as - bs;
    });
    hits.slice(0, 5).forEach(function (x) { u.items.push({ label: x.name, sub: x.kind + ' (from file)', feature: x }); });

    u.msg = q.length < 3 ? 'Type at least 3 characters to search the file.' : 'No matches in the uploaded file.';
    u.on = u.items.length ? 0 : -1;
    renderList(k);
  }

  function pickItem(k, i) {
    var it = ui[k].items[i];
    if (!it) return;
    if (it.feature) choose(k, locationOf(it.feature), it.label);
    else choose(k, it.ll, it.label);
  }

  ['start', 'end'].forEach(function (k) {
    var u = ui[k];
    u.input.addEventListener('input', function () {
      if (pts[k]) { unsetPoint(k); renderPrompt(); updateFindEnabled(); }
      showSuggestions(k);
    });
    u.input.addEventListener('focus', function () { if (u.input.value.trim() && !pts[k]) showSuggestions(k); });
    u.input.addEventListener('blur', function () { closeList(k); });
    u.input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && u.items.length) { e.preventDefault(); u.on = (u.on + 1) % u.items.length; highlight(k); }
      else if (e.key === 'ArrowUp' && u.items.length) { e.preventDefault(); u.on = (u.on - 1 + u.items.length) % u.items.length; highlight(k); }
      else if (e.key === 'Enter') { e.preventDefault(); if (u.on >= 0) pickItem(k, u.on); else showSuggestions(k, true); }
      else if (e.key === 'Escape') { closeList(k); }
    });
  });

  function resetPoints() {
    ['start', 'end'].forEach(function (k) {
      unsetPoint(k);
      ui[k].input.value = '';
      closeList(k);
    });
    renderPrompt();
    updateFindEnabled();
  }

  $('clearPts').addEventListener('click', function () { resetPoints(); clearRoutes(); hideRouteResults(); ui.start.input.focus(); });

  function readFile(file) {
    if (!file) return;
    setStatus('Reading ' + file.name + '\u2026');
    var reader = new FileReader();
    reader.onload = function () {
      try {
        load(JSON.parse(reader.result), file.name, reader.result);
      } catch (err) {
        els.sidebar.classList.remove('loaded');
        setStatus('Could not read ' + file.name + '. Check that it is valid GeoJSON.', true);
      }
    };
    reader.onerror = function () { setStatus('Could not open ' + file.name + '.', true); };
    reader.readAsText(file);
  }

  els.file.addEventListener('change', function () { readFile(els.file.files[0]); els.file.value = ''; });

  ['dragenter', 'dragover'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); els.drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); els.drop.classList.remove('over'); });
  });
  document.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    readFile(f);
  });

  window.addEventListener('resize', function () { map.invalidateSize(); });

  // =========================================================================
  // ROUTING CLIENT (added). The page only sends requests and draws results;
  // all graph, snapping, routing and timing logic lives in the C++ server.
  // =========================================================================
  var graphReady = false;       // true once /api/graph succeeds
  var graphStats = null;        // last /api/graph response
  var method = 'kdtree';        // kdtree | brute | both
  var routeLayers = [];         // drawn route polylines, in rank order
  var snapLayers = [];          // snap markers + dashed connector lines
  var lastRoutesByColor = [];   // [{layer, color, rank}] for list highlighting
  var selectedRank = -1;
  var busy = false;

  var ROUTE_COLORS = ['#7c3aed', '#f97316', '#3d8bff', '#22a06b', '#ec4899'];

  // ---- status helper that does not clobber the loaded-file status text ----
  var baseStatus = '';
  function setRouteStatus(msg, isError) {
    setStatus(msg, isError);
  }

  // ---- POST helper ----
  function postJSON(url, bodyText, isRaw) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: isRaw ? bodyText : JSON.stringify(bodyText)
    }).then(function (r) {
      return r.text().then(function (t) {
        var data;
        try { data = t ? JSON.parse(t) : {}; } catch (e) { data = { error: 'Server returned an unreadable response.' }; }
        return { ok: r.ok, status: r.status, data: data };
      });
    });
  }

  function buildGraph(rawText, fileName) {
    baseStatus = fileName + ' loaded. Building road network\u2026';
    setStatus(baseStatus);
    postJSON('/api/graph', rawText, true).then(function (res) {
      if (!res.ok) {
        graphReady = false;
        setStatus(res.data.error || 'Could not build the road network.', true);
        updateFindEnabled();
        return;
      }
      graphReady = true;
      graphStats = res.data;
      var s = res.data;
      var msg = fileName + ' \u2014 road network ready: ' +
                s.nodes.toLocaleString() + ' nodes, ' + s.edges.toLocaleString() +
                ' edges (k-d tree built in ' + s.kdTreeBuildMs.toFixed(3) + ' ms).';
      if (s.warnings && s.warnings.length) msg += ' ' + s.warnings.join(' ');
      setStatus(msg);
      updateFindEnabled();
    }).catch(function () {
      graphReady = false;
      setStatus('Could not reach the routing server. Is the C++ server running?', true);
      updateFindEnabled();
    });
  }

  // ---- Method segmented control ----
  var methodSeg = $('methodSeg');
  Array.prototype.forEach.call(methodSeg.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () {
      method = b.getAttribute('data-method');
      Array.prototype.forEach.call(methodSeg.querySelectorAll('button'), function (x) {
        x.classList.toggle('on', x === b);
      });
    });
  });

  function updateFindEnabled() {
    renderPrompt();
    var ready = graphReady && !!pts.start && !!pts.end && !busy;
    $('findBtn').disabled = !ready;
    $('benchBtn').disabled = !graphReady || busy;
  }

  // ---- Drawing ----
  function clearRoutes() {
    routeLayers.forEach(function (l) { map.removeLayer(l); });
    snapLayers.forEach(function (l) { map.removeLayer(l); });
    routeLayers = [];
    snapLayers = [];
    lastRoutesByColor = [];
    selectedRank = -1;
  }

  function latlngsFromGeometry(geom) {
    return geom.coordinates.map(function (c) { return [c[1], c[0]]; }); // lng,lat -> lat,lng
  }

  function drawSnap(point, snapped, which) {
    // small marker at the snapped node + dashed line from chosen point to it
    var color = which === 'start' ? '#f97316' : '#1f2937';
    var m = L.circleMarker([snapped.lat, snapped.lng], {
      radius: 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1, zIndexOffset: 900
    }).addTo(map);
    m.bindPopup((which === 'start' ? 'Start' : 'End') + ' snapped to node ' + snapped.nodeId +
                '<br>' + snapped.offsetMeters.toFixed(1) + ' m from your point');
    snapLayers.push(m);
    var dash = L.polyline([[point.lat, point.lng], [snapped.lat, snapped.lng]], {
      color: color, weight: 2, opacity: 0.9, dashArray: '4 5'
    }).addTo(map);
    snapLayers.push(dash);
  }

  function drawRoutes(run) {
    // run has snappedStart/snappedEnd and routes[]; draw route 1 last so it is on top
    var all = [];
    run.routes.forEach(function (rt, i) {
      var color = ROUTE_COLORS[i % ROUTE_COLORS.length];
      var weight = i === 0 ? 7 : 4;
      var opacity = i === 0 ? 0.95 : 0.75;
      var poly = L.polyline(latlngsFromGeometry(rt.geometry), {
        color: color, weight: weight, opacity: opacity
      });
      poly._rank = rt.rank;
      all.push({ layer: poly, color: color, rank: rt.rank });
    });
    // add alternatives first, fastest route on top
    for (var i = all.length - 1; i >= 0; i--) {
      all[i].layer.addTo(map);
      routeLayers.push(all[i].layer);
      (function (rank) {
        all[i].layer.on('click', function () { selectRoute(rank); });
      })(all[i].rank);
    }
    lastRoutesByColor = all;

    drawSnap(pts.start, run.snappedStart, 'start');
    drawSnap(pts.end, run.snappedEnd, 'end');

    // fit to everything drawn
    var group = L.featureGroup(routeLayers.concat(snapLayers));
    try { map.fitBounds(group.getBounds(), { padding: [70, 70], maxZoom: 17 }); } catch (e) {}
  }

  function selectRoute(rank) {
    selectedRank = rank;
    lastRoutesByColor.forEach(function (r) {
      var isSel = r.rank === rank;
      r.layer.setStyle({ weight: isSel ? 8 : (r.rank === 1 ? 7 : 4), opacity: isSel ? 1 : (r.rank === 1 ? 0.95 : 0.6) });
      if (isSel) r.layer.bringToFront();
    });
    // reflect in the list
    Array.prototype.forEach.call(document.querySelectorAll('.route-item'), function (el) {
      el.classList.toggle('sel', parseInt(el.getAttribute('data-rank'), 10) === rank);
    });
  }

  // ---- Formatting ----
  function fmtDistance(m) {
    if (m >= 1000) return (m / 1000).toFixed(2) + ' km';
    return Math.round(m) + ' m';
  }
  function fmtTime(sec) {
    if (sec < 60) return Math.round(sec) + ' s';
    var mnt = Math.floor(sec / 60), s = Math.round(sec % 60);
    if (mnt < 60) return mnt + ' min ' + (s ? s + ' s' : '').trim();
    var h = Math.floor(mnt / 60); mnt = mnt % 60;
    return h + ' h ' + mnt + ' min';
  }
  function fmtMicros(u) {
    if (u >= 1000) return (u / 1000).toFixed(3) + ' ms';
    return u.toFixed(3) + ' \u00b5s';
  }

  // ---- Results panel ----
  function hideRouteResults() { var p = $('routeResults'); p.hidden = true; p.innerHTML = ''; }
  function hideBenchResults() { var p = $('benchResults'); p.hidden = true; p.innerHTML = ''; }

  function routeListHtml(run, speedInfoFound) {
    var html = '';
    run.routes.forEach(function (rt, i) {
      var color = ROUTE_COLORS[i % ROUTE_COLORS.length];
      var tag = i === 0 ? '<span class="rtag">Fastest</span>' : '';
      var metaTime = speedInfoFound ? fmtTime(rt.travelSeconds) : null;
      var meta = fmtDistance(rt.distanceMeters) + (metaTime ? ' \u00b7 ' + metaTime : '');
      html += '<button type="button" class="route-item' + (i === 0 ? ' sel' : '') + '" data-rank="' + rt.rank +
              '" style="border-left-color:' + color + '">' +
              '<span class="swatch" style="background:' + color + '"></span>' +
              '<span class="info"><span class="rtitle">Route ' + rt.rank + tag + '</span>' +
              '<span class="rmeta">' + meta + '</span></span></button>';
    });
    return html;
  }

  function timingTableHtml(runs) {
    // runs: [{label, run}]
    var rows = '';
    runs.forEach(function (r) {
      rows += '<tr><td>' + esc(r.label) + '</td><td>' + fmtMicros(r.run.lookupMicrosAvg) +
              '</td><td>' + fmtMicros(r.run.searchMicros) + '</td><td>' + fmtMicros(r.run.totalMicros) + '</td></tr>';
    });
    return '<div class="timing"><table><caption>Timing (measured in C++, average per call)</caption>' +
           '<tr><th>Method</th><th>Lookup</th><th>Route search</th><th>Total</th></tr>' +
           rows + '</table></div>';
  }

  function showSingle(data, methodName) {
    var run = data[methodName];
    var p = $('routeResults');
    if (!run || run.error) {
      p.hidden = false;
      p.innerHTML = '<h2>Route</h2><p class="route-note warn">' + esc((run && run.error) || 'No route found.') + '</p>';
      return;
    }
    clearRoutes();
    drawRoutes(run);
    var label = methodName === 'brute' ? 'Brute force' : 'k-d tree';
    var html = '<h2>Routes</h2>';
    if (!data.speedInfoFound) html += '<p class="route-note warn">No speed data found, routes minimize distance.</p>';
    html += routeListHtml(run, data.speedInfoFound);
    html += timingTableHtml([{ label: label, run: run }]);
    p.hidden = false;
    p.innerHTML = html;
    wireRouteItems();
  }

  function showBoth(data) {
    // Prefer drawing the k-d tree run (results are identical when sameResult).
    var draw = data.kdtree && !data.kdtree.error ? data.kdtree : data.brute;
    if (!draw || draw.error) {
      var p0 = $('routeResults');
      p0.hidden = false;
      p0.innerHTML = '<h2>Route</h2><p class="route-note warn">' +
        esc((data.kdtree && data.kdtree.error) || (data.brute && data.brute.error) || 'No route found.') + '</p>';
      return;
    }
    clearRoutes();
    drawRoutes(draw);
    var p = $('routeResults');
    var html = '<h2>Routes</h2>';
    if (!data.speedInfoFound) html += '<p class="route-note warn">No speed data found, routes minimize distance.</p>';
    html += routeListHtml(draw, data.speedInfoFound);
    html += timingTableHtml([
      { label: 'k-d tree', run: data.kdtree },
      { label: 'Brute force', run: data.brute }
    ]);
    var sp = data.lookupSpeedup || 0;
    html += '<p class="speedup">Nearest-node lookup speedup: <b>' + sp.toFixed(2) + '\u00d7</b> ' +
            '(brute-force lookup time \u00f7 k-d tree lookup time).</p>';
    if (data.sameResult) {
      html += '<p class="route-note same">Both methods snapped to the same nodes and produced identical routes.</p>';
    } else {
      html += '<p class="route-note warn">The two methods snapped to different nodes.</p>';
    }
    html += '<p class="route-note">Single-query timings are tiny and noisy. Use \u201cRun benchmark\u201d for the meaningful comparison.</p>';
    p.hidden = false;
    p.innerHTML = html;
    wireRouteItems();
  }

  function wireRouteItems() {
    Array.prototype.forEach.call(document.querySelectorAll('.route-item'), function (el) {
      el.addEventListener('click', function () { selectRoute(parseInt(el.getAttribute('data-rank'), 10)); });
    });
  }

  // ---- Find route ----
  $('findBtn').addEventListener('click', function () {
    if (!graphReady || !pts.start || !pts.end || busy) return;
    busy = true; updateFindEnabled();
    hideBenchResults();
    var btn = $('findBtn'); var old = btn.textContent; btn.textContent = 'Finding\u2026';
    var body = {
      start: { lat: pts.start.lat, lng: pts.start.lng },
      end: { lat: pts.end.lat, lng: pts.end.lng },
      method: method,
      alternatives: 3,
      repeat: 1000
    };
    postJSON('/api/route', body, false).then(function (res) {
      busy = false; btn.textContent = old; updateFindEnabled();
      if (!res.ok) {
        hideRouteResults();
        setStatus(res.data.error || 'Could not find a route.', true);
        return;
      }
      if (method === 'both') showBoth(res.data);
      else showSingle(res.data, method);
    }).catch(function () {
      busy = false; btn.textContent = old; updateFindEnabled();
      setStatus('Could not reach the routing server.', true);
    });
  });

  // ---- Benchmark ----
  $('benchBtn').addEventListener('click', function () {
    if (!graphReady || busy) return;
    busy = true; updateFindEnabled();
    var btn = $('benchBtn'); var old = btn.textContent; btn.textContent = 'Running\u2026';
    var p = $('benchResults');
    p.hidden = false;
    p.innerHTML = '<h2>Benchmark</h2><p class="route-note">Running 10,000 random queries through both methods\u2026</p>';
    postJSON('/api/benchmark', { queries: 10000, seed: 1 }, false).then(function (res) {
      busy = false; btn.textContent = old; updateFindEnabled();
      if (!res.ok) { p.innerHTML = '<h2>Benchmark</h2><p class="route-note warn">' + esc(res.data.error || 'Benchmark failed.') + '</p>'; return; }
      var d = res.data;
      var html = '<h2>Benchmark</h2>';
      html += '<div class="timing"><table><caption>' + d.queries.toLocaleString() + ' random nearest-node queries</caption>' +
              '<tr><th>Method</th><th>Total</th><th>Average per query</th></tr>' +
              '<tr><td>k-d tree</td><td>' + d.kdTreeTotalMs.toFixed(3) + ' ms</td><td>' + d.kdTreeAvgMicros.toFixed(4) + ' \u00b5s</td></tr>' +
              '<tr><td>Brute force</td><td>' + d.bruteTotalMs.toFixed(3) + ' ms</td><td>' + d.bruteAvgMicros.toFixed(4) + ' \u00b5s</td></tr>' +
              '</table></div>';
      html += '<p class="speedup">k-d tree is <b>' + d.speedup.toFixed(2) + '\u00d7</b> ' +
              (d.speedup >= 1 ? 'faster' : 'the speed of') + ' brute force on this network.</p>';
      html += '<p class="route-note' + (d.mismatches === 0 ? ' same' : ' warn') + '">' +
              (d.mismatches === 0 ? 'Both methods returned the same node for every query.' :
               d.mismatches + ' mismatches (the two methods should always agree).') + '</p>';
      html += '<p class="route-note">A single lookup is too fast to time reliably; this batch is the meaningful comparison. ' +
              'On small networks the k-d tree\u2019s advantage is small and can even be slower due to overhead; it grows as the network gets larger.</p>';
      p.innerHTML = html;
    }).catch(function () {
      busy = false; btn.textContent = old; updateFindEnabled();
      p.innerHTML = '<h2>Benchmark</h2><p class="route-note warn">Could not reach the routing server.</p>';
    });
  });

  updateFindEnabled();

})();
</script>
