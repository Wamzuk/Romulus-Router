<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoJSON map viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#17222c;--mut:#5d6b78;--paper:#eef1f4;--panel:#fbfcfd;--line:#d6dce2;
  --ac:#1d5fd6;--acs:#e3ecfb;--err:#b42318;--r:8px;
}
@media(prefers-color-scheme:dark){
  :root{--ink:#e8eef4;--mut:#93a3b2;--paper:#0e151c;--panel:#151f28;--line:#27343f;--ac:#6ea2ff;--acs:#1b2b44;--err:#ff8a80}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,"Segoe UI",sans-serif}

.app{display:grid;grid-template-columns:380px 1fr;height:100vh;height:100dvh}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--paper)}

header{padding:22px 22px 16px}
h1{margin:0 0 4px;font-size:21px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.sub{margin:0;color:var(--mut);font-size:14px;max-width:44ch}

.load{padding:0 22px 18px;border-bottom:1px solid var(--line)}
.drop{display:block;padding:18px 14px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);
  cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--ac);background:var(--acs)}
.drop strong{display:block;font-weight:500}
.drop span{font-size:13px;color:var(--mut)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#status{margin:12px 0 0;font-size:14px;color:var(--mut)}
#status.ok{color:var(--ink)}
#status.err{color:var(--err)}

#searchSection{display:none;flex:1;min-height:0;flex-direction:column;padding:16px 22px 0}
#search{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px}
#search:focus-visible,.result:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#searchInfo{font-size:13px;color:var(--mut);margin:8px 0}
#results{flex:1;min-height:0;overflow-y:auto;margin:0 -22px;border-top:1px solid var(--line)}
.result{padding:10px 22px;cursor:pointer;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.result:hover,.result:focus{background:var(--acs);border-left-color:var(--ac);outline:none}
.result b{display:block;font-weight:500;overflow-wrap:anywhere}
.result span{display:block;font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.result mark{background:var(--ac);color:var(--panel);border-radius:2px;padding:0 2px}

.empty{padding:22px;color:var(--mut);font-size:14px}
.empty p{margin:0 0 8px;max-width:40ch}

.leaflet-popup-content-wrapper{border-radius:var(--r)}
.popup{font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.popup b{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
.popup table{border-collapse:collapse}
.popup td{padding:3px 8px 3px 0;border-bottom:1px solid #e1e6eb;vertical-align:top}
.popup td:first-child{color:#5d6b78;white-space:nowrap}

@media(max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52% 1fr}
  .mapwrap{order:-1}
  aside{border-right:0;border-top:1px solid var(--line)}
  header{padding:16px 18px 10px}
  .load{padding:0 18px 14px}
  #searchSection{padding:14px 18px 0}
  #results{margin:0 -18px}
  .result{padding:10px 18px}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <header>
    <h1>GeoJSON map viewer</h1>
    <p class="sub">Load a GeoJSON file to see its points, lines, and polygons on the map. Click a feature to read its properties.</p>
  </header>

  <div class="load">
    <label class="drop" id="drop">
      <strong>Choose a GeoJSON file</strong>
      <span>or drag it here (.geojson or .json)</span>
      <input type="file" id="file" accept=".geojson,.json,application/geo+json,application/json">
    </label>
    <div id="status">No file loaded yet.</div>
  </div>

  <div class="empty" id="empty">
    <p>Once a file is loaded, you can search every feature by name or property value here.</p>
  </div>

  <section id="searchSection">
    <input type="search" id="search" placeholder="Search by name or any property" aria-label="Search features">
    <div id="searchInfo"></div>
    <div id="results"></div>
  </section>
</aside>

<div class="mapwrap"><div id="map"></div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let map, dataLayer;
// Search index: one entry per feature with its layer and a lowercased
// concatenation of all property keys/values for matching.
let index = [];

// Feature styles. Bright colors so they stay visible on satellite imagery.
const LINE = { color: '#3fd0ff', weight: 3, opacity: 0.95, fillColor: '#3fd0ff', fillOpacity: 0.2 };
const LINE_HI = { color: '#ff4d6d', weight: 5, fillColor: '#ff4d6d', fillOpacity: 0.4 };
const DOT = { radius: 6, color: '#fff', weight: 2, fillColor: '#ffb020', fillOpacity: 0.95 };
const DOT_HI = { radius: 9, color: '#fff', weight: 3, fillColor: '#ff4d6d', fillOpacity: 1 };

function setStatus(msg, kind){
  const s = $('status');
  s.textContent = msg;
  s.className = kind || '';
}

function initMap(){
  if(typeof L === 'undefined'){
    setStatus('The map library could not load. Check your internet connection.', 'err');
    return false;
  }
  if(!map){
    map = L.map('map').setView([20, 0], 2);
    // Esri World Imagery: free satellite basemap, no API key or account needed.
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
    }).addTo(map);
  }
  return true;
}

const ENT = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
const esc = s => String(s).replace(/[&<>"]/g, c => ENT[c]);

// Build a popup from a feature's properties.
function popupFor(feature){
  const p = feature.properties || {};
  const name = p.name || p.Name || p.title || p.Title || '';
  const keys = Object.keys(p);
  let html = '<div class="popup">';
  if(name) html += '<b>' + esc(name) + '</b>';
  if(keys.length){
    html += '<table>';
    for(const k of keys){
      let v = p[k];
      if(v !== null && typeof v === 'object') v = JSON.stringify(v);
      html += '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>';
    }
    html += '</table>';
  }
  if(!name && !keys.length) html += '<i>(no properties)</i>';
  return html + '</div>';
}

// A short human label for a feature, for the results list.
function labelFor(feature){
  const p = feature.properties || {};
  return p.name || p.Name || p.title || p.Title || p.id || p.ID ||
    (feature.geometry ? feature.geometry.type : 'Feature');
}

// Draw points as circle markers so they are always visible.
const pointToLayer = (feature, latlng) => L.circleMarker(latlng, DOT);

const isPoint = f => f.geometry && f.geometry.type.indexOf('Point') >= 0;

function renderGeoJSON(data){
  if(!initMap()) return;
  if(dataLayer) dataLayer.remove();
  index = [];
  highlighted = null;

  dataLayer = L.geoJSON(data, {
    pointToLayer,
    style: LINE,
    onEachFeature: (feature, layer) => {
      layer.bindPopup(popupFor(feature));
      // Build a searchable text blob from every property key and value.
      const p = feature.properties || {};
      let text = '';
      for(const k of Object.keys(p)){
        let v = p[k];
        if(v !== null && typeof v === 'object') v = JSON.stringify(v);
        text += k + ' ' + v + ' ';
      }
      index.push({ feature, layer, label: labelFor(feature), text: text.toLowerCase() });
    }
  }).addTo(map);

  const bounds = dataLayer.getBounds();
  if(bounds.isValid()){
    map.fitBounds(bounds.pad(0.1));
  } else {
    setStatus('This file loaded, but it has no geometry to draw.', 'err');
    $('searchSection').style.display = 'none';
    $('empty').style.display = '';
    return;
  }

  setStatus(index.length.toLocaleString() + ' feature' + (index.length === 1 ? '' : 's') + ' loaded.', 'ok');

  // Reveal and reset the search UI now that data is loaded.
  $('empty').style.display = 'none';
  $('searchSection').style.display = 'flex';
  $('search').value = '';
  runSearch('');
}

// Highlight a chosen feature: pan/zoom to it, emphasize it, open its popup.
let highlighted = null;
function goToFeature(entry){
  const layer = entry.layer;
  // Restore the previously highlighted feature.
  if(highlighted && highlighted.layer.setStyle){
    highlighted.layer.setStyle(isPoint(highlighted.feature) ? DOT : LINE);
  }
  if(layer.getBounds){
    map.fitBounds(layer.getBounds().pad(0.3), { maxZoom: 17 });
  } else if(layer.getLatLng){
    map.setView(layer.getLatLng(), Math.max(map.getZoom(), 15));
  }
  if(layer.setStyle){
    layer.setStyle(isPoint(entry.feature) ? DOT_HI : LINE_HI);
    if(layer.bringToFront) layer.bringToFront();
    highlighted = entry;
  }
  if(layer.openPopup) layer.openPopup();
}

// Escape a string for safe use in a regex.
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// Render the results list for the current query.
function runSearch(q){
  const results = $('results');
  const info = $('searchInfo');
  q = q.trim().toLowerCase();

  const matches = q === '' ? index : index.filter(e =>
    e.text.includes(q) || e.label.toLowerCase().includes(q));

  if(q === ''){
    info.textContent = index.length.toLocaleString() + ' feature' + (index.length === 1 ? '' : 's') + '. Type to filter.';
  } else {
    info.textContent = matches.length.toLocaleString() + ' match' + (matches.length === 1 ? '' : 'es') + ' for "' + q + '".';
  }

  const shown = matches.slice(0, 500); // cap the DOM for big files
  const re = q ? new RegExp('(' + reEsc(esc(q)) + ')', 'ig') : null;
  const hl = s => q ? esc(s).replace(re, '<mark>$1</mark>') : esc(s);

  results.innerHTML = shown.map((e, i) => {
    const p = e.feature.properties || {};
    // A small preview: first few non-empty property values.
    const preview = Object.entries(p)
      .filter(([, v]) => v !== null && v !== '' && typeof v !== 'object')
      .slice(0, 3).map(([k, v]) => k + ': ' + v).join(', ');
    return '<div class="result" tabindex="0" data-i="' + i + '">' +
      '<b>' + hl(String(e.label)) + '</b>' +
      (preview ? '<span>' + hl(preview) + '</span>' : '') +
    '</div>';
  }).join('');

  if(q && matches.length > shown.length){
    info.textContent += ' Showing the first ' + shown.length.toLocaleString() + '.';
  }

  // Wire clicks/keyboard on each result to the matching entry.
  results.querySelectorAll('.result').forEach(el => {
    const entry = shown[+el.dataset.i];
    el.onclick = () => goToFeature(entry);
    el.onkeydown = ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); goToFeature(entry); } };
  });
}

$('search').oninput = e => runSearch(e.target.value);

async function loadFile(f){
  if(!f) return;
  setStatus('Reading ' + f.name + '...');
  try{
    const data = JSON.parse(await f.text());
    renderGeoJSON(data);
  }catch(err){
    setStatus('Could not read that file as GeoJSON: ' + err.message, 'err');
  }
}

$('file').onchange = e => loadFile(e.target.files[0]);

// Drag and drop onto the upload box.
const drop = $('drop');
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

initMap();
</script>
</body>
</html>
